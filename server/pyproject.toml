[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "astropy>=8.0.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "reproject>=0.21.0",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
